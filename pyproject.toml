[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai"
version = "0.1.0"
description = "AI-powered incident investigation and root-cause analysis using LangGraph, hybrid RAG, and evidence correlation."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aegis Team" }]
license = { text = "MIT" }
keywords = [
    "ai",
    "agentic-ai",
    "langgraph",
    "rag",
    "llm",
    "incident-management",
    "root-cause-analysis",
    "fastapi",
    "qdrant",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.31",
    "psycopg[binary]>=3.2.1",
    "redis>=5.0.1",
    "qdrant-client>=1.9.1",
    "langchain>=0.3.2",
    "langgraph>=0.2.29",
    "langchain-community>=0.3.2",
    "langchain-google-genai>=2.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "orjson>=3.9.15",
    "cohere>=5.7.0",
    "ragas>=0.1.13",
    "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.2",
    "black>=24.8.0",
    "mypy>=1.11.1",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend"]

[tool.black]
line-length = 100
target-version = ["py311"]
